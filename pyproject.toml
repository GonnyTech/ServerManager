[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "server-guardian"
version = "1.0.0"
description = "Semiautomatic Server Management Tool (Client-Daemon) for Ubuntu Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "GonnyTech" }
]
dependencies = [
    "textual>=0.50.0",
    "docker>=6.1.0",
    "psutil>=5.9.0",
    "cryptography>=41.0.0",
    "packaging>=23.0"
]

[tool.setuptools.packages.find]
include = ["server_guardian*"]

[tool.setuptools.package-data]
"server_guardian.tui" = ["*.tcss"]

[project.scripts]
server-guardian = "server_guardian.cli:main"

