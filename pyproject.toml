[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "server-guardian"
version = "1.0.0"
description = "Semiautomatic Server Management Tool (Client-Daemon) for Ubuntu Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "GonnyTech" }
]
dependencies = [
    "textual>=0.50.0",
    "docker>=6.1.0",
    "psutil>=5.9.0",
    "cryptography>=41.0.0",
    "packaging>=23.0"
]

[project.scripts]
server-guardian = "server_guardian.cli:main"
